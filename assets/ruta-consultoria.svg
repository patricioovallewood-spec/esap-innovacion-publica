<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480"><rect width="1200" height="1480" fill="#ffffff"/><rect width="1200" height="205" fill="#092d5b"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f6bd45">ESAP · INNOVACIÓN PÚBLICA / PROPUESTA</text><text x="55" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Cómo lo hacemos</text><text x="55" y="148" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#fff">Consultoría ágil e implementación</text><path d="M80 286V430" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="250" r="23" fill="#087c82"/><text x="74" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="256" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087c82">Escuchar e investigar</text><text x="125" y="289" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Observamos la experiencia de las personas y revisamos información con los equipos que prestan el</text><text x="125" y="314" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">servicio.</text><text x="125" y="349" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Entrevistas, observación, revisión de registros y recorrido del usuario.</text><text x="125" y="396" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Problema documentado y una línea de base inicial.</text><path d="M80 481V625" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="445" r="23" fill="#087c82"/><text x="74" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="125" y="451" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087c82">Delimitar el reto</text><text x="125" y="484" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Acordamos qué se quiere cambiar, para quién, con qué alcance y quién responderá por su</text><text x="125" y="509" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">continuidad.</text><text x="125" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Ficha de desafío, mapa de actores y criterios de priorización.</text><text x="125" y="591" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Reto definido, contraparte y criterios de resultado.</text><path d="M80 676V820" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="640" r="23" fill="#087c82"/><text x="74" y="647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="125" y="646" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087c82">Cocrear la respuesta</text><text x="125" y="679" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Desarrollamos y contrastamos alternativas con usuarios, equipos públicos y capacidades del</text><text x="125" y="704" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">ecosistema.</text><text x="125" y="739" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Taller de cocreación, prototipo y revisión de viabilidad.</text><text x="125" y="786" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Una alternativa priorizada y condiciones de implementación.</text><path d="M80 871V1015" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="835" r="23" fill="#087c82"/><text x="74" y="842" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="125" y="841" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087c82">Probar e implementar</text><text x="125" y="874" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Ensayamos la solución en un alcance acotado y acompañamos su puesta en marcha según las decisiones</text><text x="125" y="899" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">y habilitaciones necesarias.</text><text x="125" y="934" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Protocolo de prueba, indicadores, registro de incidencias y plan de trabajo.</text><text x="125" y="981" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Evidencia de funcionamiento y aprendizajes de la intervención.</text><circle cx="80" cy="1030" r="23" fill="#087c82"/><text x="74" y="1037" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="125" y="1036" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087c82">Evaluar y adoptar</text><text x="125" y="1069" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Revisamos resultados y condiciones para recomendar adopción, ajustes o cierre, con el área</text><text x="125" y="1094" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">responsable.</text><text x="125" y="1129" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Evaluación del piloto, decisión documentada y plan de sostenimiento.</text><text x="125" y="1176" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Decisión institucional y ruta de continuidad.</text><path d="M55 1235H1145" stroke="#dce3eb"/><text x="55" y="1277" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#087c82">Qué dejamos instalado</text><text x="55" y="1316" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Diagnóstico y reto priorizado</text><text x="55" y="1345" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Solución diseñada o modelo institucional</text><text x="55" y="1374" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Prueba y decisión de continuidad</text><text x="55" y="1438" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64758a">Ruta metodológica propuesta · Adaptable al desafío y las capacidades de cada entidad.</text></svg>