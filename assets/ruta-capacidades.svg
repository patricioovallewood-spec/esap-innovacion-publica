<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480"><rect width="1200" height="1480" fill="#ffffff"/><rect width="1200" height="205" fill="#092d5b"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f6bd45">ESAP · INNOVACIÓN PÚBLICA / PROPUESTA</text><text x="55" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Cómo lo hacemos</text><text x="55" y="148" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#fff">Capacidades para innovar</text><path d="M80 286V430" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="250" r="23" fill="#1565b0"/><text x="74" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="256" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1565b0">Acordar capacidades</text><text x="125" y="289" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Conversamos con autoridades y equipos para identificar qué decisiones y desafíos deben abordar.</text><text x="125" y="349" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Entrevista inicial, diagnóstico de competencias y ficha del desafío.</text><text x="125" y="396" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Necesidades de aprendizaje y un desafío institucional acordado.</text><path d="M80 481V625" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="445" r="23" fill="#1565b0"/><text x="74" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="125" y="451" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1565b0">Diseñar el trayecto</text><text x="125" y="484" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Adaptamos contenidos, casos, facilitación y mentorías a las condiciones del grupo y del</text><text x="125" y="509" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">territorio.</text><text x="125" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Mapa de competencias y diseño de la experiencia de aprendizaje.</text><text x="125" y="591" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Trayecto formativo y criterios de aplicación definidos.</text><path d="M80 676V820" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="640" r="23" fill="#1565b0"/><text x="74" y="647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="125" y="646" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1565b0">Aprender con casos</text><text x="125" y="679" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Combinamos casos, conversaciones entre pares y ejercicios sobre decisiones reales de gestión.</text><text x="125" y="739" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Estudios de caso, simulaciones, clínicas y sesiones con especialistas.</text><text x="125" y="786" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Herramientas ensayadas sobre situaciones del trabajo público.</text><path d="M80 871V1015" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="835" r="23" fill="#1565b0"/><text x="74" y="842" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="125" y="841" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1565b0">Desarrollar un proyecto</text><text x="125" y="874" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Cada participante o equipo utiliza lo aprendido para estructurar una iniciativa de su entidad.</text><text x="125" y="934" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Ficha de proyecto, mapa de actores y revisión con la contraparte institucional.</text><text x="125" y="981" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Proyecto con propósito, responsables y una ruta de implementación.</text><circle cx="80" cy="1030" r="23" fill="#1565b0"/><text x="74" y="1037" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="125" y="1036" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1565b0">Acompañar y transferir</text><text x="125" y="1069" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Las mentorías ayudan a resolver dificultades de aplicación y a compartir aprendizajes entre</text><text x="125" y="1094" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">participantes.</text><text x="125" y="1129" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Mentorías, revisión entre pares y evaluación de aplicación.</text><text x="125" y="1176" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Plan de continuidad y capacidades transferidas al equipo.</text><path d="M55 1235H1145" stroke="#dce3eb"/><text x="55" y="1277" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1565b0">Qué dejamos instalado</text><text x="55" y="1316" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Trayecto formativo adaptado</text><text x="55" y="1345" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Proyecto aplicado</text><text x="55" y="1374" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Mentorías y plan de continuidad</text><text x="55" y="1438" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64758a">Ruta metodológica propuesta · Adaptable al desafío y las capacidades de cada entidad.</text></svg>