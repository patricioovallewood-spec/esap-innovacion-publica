<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550"><rect width="1200" height="1550" fill="#fff"/><rect width="1200" height="190" fill="#092d5b"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f6bd45">ESAP · INNOVACIÓN PÚBLICA / PROPUESTA</text><text x="55" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Cómo lo hacemos</text><text x="55" y="148" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#fff">Redes y ferias demostrativas</text><circle cx="80" cy="250" r="23" fill="#69519a"/><text x="74" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="256" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Definir el propósito</text><text x="125" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Acordamos qué desafíos, experiencias y públicos orientan la red, la feria o la comunicación.</text><text x="125" y="358" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Agenda temática, públicos y criterios de participación.</text><text x="125" y="413" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Propósito y alcance definidos.</text><circle cx="80" cy="460" r="23" fill="#69519a"/><text x="74" y="467" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="125" y="466" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Preparar experiencias</text><text x="125" y="500" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Identificamos equipos y soluciones y revisamos qué pueden demostrar y con qué evidencia.</text><text x="125" y="568" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Convocatoria, ficha de experiencia y revisión de resultados.</text><text x="125" y="623" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Experiencias preparadas y condiciones de uso claras.</text><circle cx="80" cy="670" r="23" fill="#69519a"/><text x="74" y="677" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="125" y="676" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Mostrar y conectar</text><text x="125" y="710" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Facilitamos demostraciones, conversaciones y trabajo entre pares alrededor de necesidades</text><text x="125" y="735" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">concretas.</text><text x="125" y="778" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Demostraciones, clínicas, encuentros y sesiones de vinculación.</text><text x="125" y="833" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Equipos conectados y oportunidades identificadas.</text><circle cx="80" cy="880" r="23" fill="#69519a"/><text x="74" y="887" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="125" y="886" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Comunicar aprendizajes</text><text x="125" y="920" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Convertimos las experiencias en contenidos claros sobre el problema, la solución, los</text><text x="125" y="945" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">resultados y sus límites.</text><text x="125" y="988" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Casos breves, fichas, videos y contenidos accesibles.</text><text x="125" y="1043" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Materiales de comunicación y aprendizaje.</text><circle cx="80" cy="1090" r="23" fill="#69519a"/><text x="74" y="1097" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="125" y="1096" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Dar seguimiento</text><text x="125" y="1130" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Revisamos las conexiones y los compromisos y derivamos los desafíos que requieren asistencia</text><text x="125" y="1155" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">técnica.</text><text x="125" y="1198" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Registro de contactos, agenda de la red y seguimiento de acuerdos.</text><text x="125" y="1253" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Próximos pasos y derivaciones a los demás ejes.</text><text x="55" y="1340" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#69519a">Qué dejamos instalado</text><text x="55" y="1380" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Agenda de red o feria</text><text x="55" y="1410" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Experiencias y demostraciones documentadas</text><text x="55" y="1440" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Conexiones y acciones de continuidad</text><text x="55" y="1510" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64758a">Ruta propuesta · Adaptable al desafío y las capacidades de cada entidad.</text></svg>