<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480"><rect width="1200" height="1480" fill="#ffffff"/><rect width="1200" height="205" fill="#092d5b"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f6bd45">ESAP · INNOVACIÓN PÚBLICA / PROPUESTA</text><text x="55" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Cómo lo hacemos</text><text x="55" y="148" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#fff">Articulación territorial, ecosistemas y cultura</text><path d="M80 286V430" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="250" r="23" fill="#906410"/><text x="74" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="256" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#906410">Reconocer capacidades</text><text x="125" y="289" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Identificamos actores, relaciones existentes y contribuciones que podrían movilizarse frente a</text><text x="125" y="314" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">necesidades locales.</text><text x="125" y="349" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Mapa de actores, entrevistas y lectura de capacidades territoriales.</text><text x="125" y="396" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Mapa del ecosistema y oportunidades de colaboración.</text><path d="M80 481V625" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="445" r="23" fill="#906410"/><text x="74" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="125" y="451" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#906410">Escuchar y conectar</text><text x="125" y="484" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Acercamos a gobiernos, academia, empresas y ciudadanía para comprender intereses y desafíos</text><text x="125" y="509" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">compartidos.</text><text x="125" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Conversaciones territoriales, encuentros de trabajo y formulación de desafíos.</text><text x="125" y="591" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Necesidades compartidas y actores dispuestos a colaborar.</text><path d="M80 676V820" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="640" r="23" fill="#906410"/><text x="74" y="647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="125" y="646" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#906410">Acordar una agenda</text><text x="125" y="679" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Definimos qué se trabajará, quién aporta, qué se espera obtener y cómo se tomarán las decisiones.</text><text x="125" y="739" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Agenda de colaboración, matriz de aportes y acuerdos por proyecto.</text><text x="125" y="786" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Proyectos y compromisos con responsables.</text><path d="M80 871V1015" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="835" r="23" fill="#906410"/><text x="74" y="842" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="125" y="841" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#906410">Activar la colaboración</text><text x="125" y="874" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Organizamos comunidades, convocatorias, eventos y sesiones de trabajo vinculados con la agenda</text><text x="125" y="899" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">acordada.</text><text x="125" y="934" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Comunidad de práctica, convocatoria y facilitación de proyectos.</text><text x="125" y="981" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Equipos conectados y acciones de colaboración en marcha.</text><circle cx="80" cy="1030" r="23" fill="#906410"/><text x="74" y="1037" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="125" y="1036" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#906410">Sostener y aprender</text><text x="125" y="1069" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Damos seguimiento a compromisos y promovemos el intercambio para que la red mantenga una actividad</text><text x="125" y="1094" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">útil.</text><text x="125" y="1129" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Registro de compromisos, sesiones de seguimiento y aprendizaje entre pares.</text><text x="125" y="1176" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Agenda de continuidad y aprendizajes compartidos.</text><path d="M55 1235H1145" stroke="#dce3eb"/><text x="55" y="1277" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#906410">Qué dejamos instalado</text><text x="55" y="1316" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Mapa de capacidades</text><text x="55" y="1345" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Agenda y acuerdos de colaboración</text><text x="55" y="1374" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Comunidad y proyectos acompañados</text><text x="55" y="1438" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64758a">Ruta metodológica propuesta · Adaptable al desafío y las capacidades de cada entidad.</text></svg>