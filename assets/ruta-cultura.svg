<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550"><rect width="1200" height="1550" fill="#fff"/><rect width="1200" height="190" fill="#092d5b"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f6bd45">ESAP · INNOVACIÓN PÚBLICA / PROPUESTA</text><text x="55" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Cómo lo hacemos</text><text x="55" y="148" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#fff">Desarrollo de entorno y cultura</text><circle cx="80" cy="250" r="23" fill="#9b6515"/><text x="74" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="256" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9b6515">Escuchar el entorno</text><text x="125" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Conversamos con los equipos y actores locales para reconocer barreras, relaciones y prácticas</text><text x="125" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">existentes.</text><text x="125" y="358" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Entrevistas, mapa de actores y lectura de barreras.</text><text x="125" y="413" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Condiciones y oportunidades de cambio identificadas.</text><circle cx="80" cy="460" r="23" fill="#9b6515"/><text x="74" y="467" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="125" y="466" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9b6515">Acordar compromisos</text><text x="125" y="500" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Definimos con la dirección y los equipos qué condiciones se necesitan para proponer y</text><text x="125" y="525" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">desarrollar mejoras.</text><text x="125" y="568" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Acuerdos de liderazgo, mapa de responsabilidades y dedicaciones.</text><text x="125" y="623" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Compromisos de respaldo y colaboración.</text><circle cx="80" cy="670" r="23" fill="#9b6515"/><text x="74" y="677" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="125" y="676" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9b6515">Abrir la participación</text><text x="125" y="710" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Diseñamos mecanismos para que equipos y aliados aporten ideas y capacidades a desafíos</text><text x="125" y="735" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">concretos.</text><text x="125" y="778" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Convocatorias, concursos, sesiones de escucha y criterios de selección.</text><text x="125" y="833" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Propuestas y capacidades identificadas con una ruta de trabajo.</text><circle cx="80" cy="880" r="23" fill="#9b6515"/><text x="74" y="887" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="125" y="886" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9b6515">Instalar prácticas</text><text x="125" y="920" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Acompañamos rutinas de colaboración y el desarrollo inicial de mejoras o proyectos</text><text x="125" y="945" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">compartidos.</text><text x="125" y="988" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Sesiones entre áreas, retroalimentación y acuerdos por proyecto.</text><text x="125" y="1043" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Prácticas en uso y primeras iniciativas acompañadas.</text><circle cx="80" cy="1090" r="23" fill="#9b6515"/><text x="74" y="1097" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="125" y="1096" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9b6515">Revisar y sostener</text><text x="125" y="1130" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Contrastamos los cambios con el punto de partida y acordamos qué prácticas necesitan</text><text x="125" y="1155" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">continuidad o ajustes.</text><text x="125" y="1198" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Revisión con equipos, seguimiento de compromisos y aprendizaje.</text><text x="125" y="1253" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Plan de continuidad y responsables.</text><text x="55" y="1340" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9b6515">Qué dejamos instalado</text><text x="55" y="1380" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Barreras y capacidades identificadas</text><text x="55" y="1410" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Acuerdos y prácticas de colaboración</text><text x="55" y="1440" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Agenda de iniciativas y seguimiento</text><text x="55" y="1510" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64758a">Ruta propuesta · Adaptable al desafío y las capacidades de cada entidad.</text></svg>