<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550"><rect width="1200" height="1550" fill="#fff"/><rect width="1200" height="190" fill="#092d5b"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f6bd45">ESAP · INNOVACIÓN PÚBLICA / PROPUESTA</text><text x="55" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Cómo lo hacemos</text><text x="55" y="148" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#fff">Diagnóstico, evaluación y aprendizaje</text><circle cx="80" cy="250" r="23" fill="#69519a"/><text x="74" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="256" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Definir la pregunta</text><text x="125" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Precisamos qué decisión necesita evidencia y qué aspectos de la experiencia territorial o</text><text x="125" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">institucional deben comprenderse.</text><text x="125" y="358" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Pregunta de evaluación, ficha de necesidad y revisión de antecedentes.</text><text x="125" y="413" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Alcance del diagnóstico o evaluación acordado.</text><circle cx="80" cy="460" r="23" fill="#69519a"/><text x="74" y="467" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="125" y="466" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Construir la línea de base</text><text x="125" y="500" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Recogemos datos y perspectivas de personas y equipos, identificando la calidad y las</text><text x="125" y="525" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">limitaciones de la información.</text><text x="125" y="568" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Revisión de registros, entrevistas e instrumentos de diagnóstico.</text><text x="125" y="623" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Línea de base y evidencias con fuentes identificadas.</text><circle cx="80" cy="670" r="23" fill="#69519a"/><text x="74" y="677" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="125" y="676" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Analizar y orientar</text><text x="125" y="710" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Interpretamos capacidades, brechas y oportunidades para proponer prioridades diferenciadas.</text><text x="125" y="778" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Matriz de capacidades, análisis de barreras y ruta de fortalecimiento.</text><text x="125" y="833" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Diagnóstico y recomendaciones aplicables al contexto.</text><circle cx="80" cy="880" r="23" fill="#69519a"/><text x="74" y="887" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="125" y="886" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Evaluar los resultados</text><text x="125" y="920" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Contrastamos lo observado con los objetivos acordados, incluyendo accesibilidad y condiciones</text><text x="125" y="945" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">de continuidad.</text><text x="125" y="988" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Indicadores, comparación con línea de base y revisión con usuarios.</text><text x="125" y="1043" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Resultados, limitaciones y decisiones recomendadas.</text><circle cx="80" cy="1090" r="23" fill="#69519a"/><text x="74" y="1097" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="125" y="1096" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Transferir lo aprendido</text><text x="125" y="1130" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Documentamos qué funcionó, bajo qué condiciones y qué requiere adaptación en otra entidad.</text><text x="125" y="1198" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Caso de aprendizaje, guía de implementación y sesión de transferencia.</text><text x="125" y="1253" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Herramientas y condiciones de adaptación para otros territorios.</text><text x="55" y="1340" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#69519a">Qué dejamos instalado</text><text x="55" y="1380" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Diagnóstico o evaluación con evidencia</text><text x="55" y="1410" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Recomendaciones para decidir</text><text x="55" y="1440" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Caso, guía y condiciones de transferencia</text><text x="55" y="1510" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64758a">Ruta propuesta · Adaptable al desafío y las capacidades de cada entidad.</text></svg>