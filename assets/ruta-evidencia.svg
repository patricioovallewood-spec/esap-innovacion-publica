<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480"><rect width="1200" height="1480" fill="#ffffff"/><rect width="1200" height="205" fill="#092d5b"/><text x="55" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f6bd45">ESAP · INNOVACIÓN PÚBLICA / PROPUESTA</text><text x="55" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Cómo lo hacemos</text><text x="55" y="148" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#fff">Inteligencia territorial, evaluación y transferencia</text><path d="M80 286V430" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="250" r="23" fill="#69519a"/><text x="74" y="257" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="125" y="256" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Definir la pregunta</text><text x="125" y="289" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Precisamos qué decisión necesita evidencia y qué aspectos de la experiencia territorial o</text><text x="125" y="314" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">institucional deben comprenderse.</text><text x="125" y="349" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Pregunta de evaluación, ficha de necesidad y revisión de antecedentes.</text><text x="125" y="396" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Alcance del diagnóstico o evaluación acordado.</text><path d="M80 481V625" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="445" r="23" fill="#69519a"/><text x="74" y="452" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="125" y="451" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Construir la línea de base</text><text x="125" y="484" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Recogemos datos y perspectivas de personas y equipos, identificando la calidad y las limitaciones</text><text x="125" y="509" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">de la información.</text><text x="125" y="544" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Revisión de registros, entrevistas e instrumentos de diagnóstico.</text><text x="125" y="591" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Línea de base y evidencias con fuentes identificadas.</text><path d="M80 676V820" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="640" r="23" fill="#69519a"/><text x="74" y="647" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="125" y="646" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Analizar y orientar</text><text x="125" y="679" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Interpretamos capacidades, brechas y oportunidades para proponer prioridades diferenciadas.</text><text x="125" y="739" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Matriz de capacidades, análisis de barreras y ruta de fortalecimiento.</text><text x="125" y="786" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Diagnóstico y recomendaciones aplicables al contexto.</text><path d="M80 871V1015" fill="none" stroke="#cbd7e5" stroke-width="2"/><circle cx="80" cy="835" r="23" fill="#69519a"/><text x="74" y="842" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="125" y="841" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Evaluar los resultados</text><text x="125" y="874" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Contrastamos lo observado con los objetivos acordados, incluyendo accesibilidad y condiciones de</text><text x="125" y="899" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">continuidad.</text><text x="125" y="934" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Indicadores, comparación con línea de base y revisión con usuarios.</text><text x="125" y="981" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Resultados, limitaciones y decisiones recomendadas.</text><circle cx="80" cy="1030" r="23" fill="#69519a"/><text x="74" y="1037" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="125" y="1036" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#69519a">Transferir lo aprendido</text><text x="125" y="1069" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">Documentamos qué funcionó, bajo qué condiciones y qué requiere adaptación en otra entidad.</text><text x="125" y="1129" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506277">Herramientas: Caso de aprendizaje, guía de implementación y sesión de transferencia.</text><text x="125" y="1176" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#13263e">Producto: Herramientas y condiciones de adaptación para otros territorios.</text><path d="M55 1235H1145" stroke="#dce3eb"/><text x="55" y="1277" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#69519a">Qué dejamos instalado</text><text x="55" y="1316" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Diagnóstico o evaluación con evidencia</text><text x="55" y="1345" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Recomendaciones para decidir</text><text x="55" y="1374" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#13263e">• Caso, guía y condiciones de transferencia</text><text x="55" y="1438" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64758a">Ruta metodológica propuesta · Adaptable al desafío y las capacidades de cada entidad.</text></svg>